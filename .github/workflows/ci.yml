name: CI

# Runs the checks that were being run by hand until now, so a PR can't merge on the
# assumption that someone remembered to.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        working-directory: backend
        run: ./gradlew build --no-daemon

      # Without this a failure means reading raw Gradle output; the reports say which
      # assertion failed.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # tsc runs as part of the build script, so this covers type errors too.
      - name: Build
        working-directory: frontend
        run: npm run build
